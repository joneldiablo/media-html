<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>demo — media-html</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: system-ui, sans-serif;
    color: #fff;
    background:
      radial-gradient(900px 500px at 15% 15%, rgba(168,85,247,.5), transparent 60%),
      radial-gradient(800px 500px at 85% 85%, rgba(14,165,233,.45), transparent 60%),
      #0a0d14;
    position: relative;
  }
  .orb { position: absolute; border-radius: 50%; filter: blur(2px); opacity: .7; }
  .orb.a {
    left: 0; top: 0;
    width: var(--media-w); height: var(--media-h);
    background: conic-gradient(from 0deg,
      rgba(168,85,247,.35), transparent 40%,
      rgba(14,165,233,.3), transparent 80%,
      rgba(168,85,247,.35));
    animation: spin 12s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .orb.b {
    left: 8%; top: 18%; width: 14%; aspect-ratio: 1;
    background: radial-gradient(circle at 35% 35%, #f0abfc, #a855f7 60%, transparent);
    animation: floaty 5s ease-in-out infinite;
  }
  .orb.c {
    right: 10%; bottom: 20%; width: 9%; aspect-ratio: 1;
    background: radial-gradient(circle at 35% 35%, #bae6fd, #0ea5e9 60%, transparent);
    animation: floaty 4.2s ease-in-out .8s infinite reverse;
  }
  @keyframes floaty {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-34px); }
  }
  .card {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    text-align: center; padding: 2.6em 4em;
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 1.8em;
    background: rgba(10,13,20,.55);
    backdrop-filter: blur(10px);
    box-shadow: 0 24px 70px rgba(0,0,0,.55);
  }
  .logo { font-size: 3.2em; }
  h1 {
    font-size: 2.6em; letter-spacing: .03em;
    background: linear-gradient(90deg, #e9d5ff, #7dd3fc);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .size { margin-top: .8em; font-size: 1.25em; opacity: .8; font-variant-numeric: tabular-nums; }
  .meta { margin-top: .35em; font-size: .95em; opacity: .55; }
  .ring {
    margin: 1.4em auto 0; width: 3.2em; height: 3.2em; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.15); border-top-color: #a855f7;
    animation: spin 1.2s linear infinite;
  }
</style>
</head>
<body>
  <div class="orb a"></div>
  <div class="orb b"></div>
  <div class="orb c"></div>
  <div class="card">
    <div class="logo">🎬</div>
    <h1>media-html</h1>
    <div class="size" id="size"></div>
    <div class="meta" id="meta"></div>
    <div class="ring"></div>
  </div>
  <script>
    // el bridge dispara 'media:init' cuando ya definió --media-w / --media-h
    function showSize() {
      var w = getComputedStyle(document.documentElement).getPropertyValue('--media-w').trim();
      var h = getComputedStyle(document.documentElement).getPropertyValue('--media-h').trim();
      document.getElementById('size').textContent = w.replace('px','') + ' × ' + h.replace('px','') + ' px';
      document.getElementById('meta').textContent = 'lienzo real: ' + w + ' × ' + h + ' · el panel solo escala la vista';
    }
    window.addEventListener('media:init', showSize);
  </script>
  <script src="../bridge.js"></script>
</body>
</html>
